<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Small Magic</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0d0919; overflow: hidden; touch-action: none; }
      #view, #view canvas, #touch, #touch * { touch-action: none; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      /* While the meadow is made, and until they begin: one rune circle in gold on a dark ground, written as the
         loading goes, its two parts turning slowly against each other; the name under it; and a line of what is
         being done. Nothing else. What moves here moves by transform and opacity alone (each turning part is a
         picture of its own), so it goes on moving smoothly while the page is busy building the world. */
      #title { position: fixed; inset: 0; z-index: 5; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.2vh;
        background: radial-gradient(ellipse 80% 75% at 50% 44%, #1d1436 0, #130d26 46%, #0a0714 100%); color: #f1d9a4;
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; text-transform: uppercase; animation: arrive 1.2s ease both; transition: opacity 0.9s ease; }
      #title.gone { opacity: 0; pointer-events: none; }
      #sigil { position: relative; width: min(44vh, 66vw); aspect-ratio: 1; --p: 0.02; transition: transform 1.2s cubic-bezier(0.2, 0.6, 0.2, 1), opacity 0.9s ease; }
      /* (as they begin it opens outward and is gone, as a spell is let go) */
      #title.gone #sigil { transform: scale(1.7); opacity: 0; }
      #sigil svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: #f1d9a4; stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 0.7vh rgba(255, 190, 110, 0.55)); will-change: transform; }
      #outer { animation: turn 90s linear infinite; }
      #inner { animation: turn 140s linear infinite reverse; }
      /* each line is drawn from nothing to whole over its own stretch of the loading: the rim first, the heart last */
      #sigil [pathLength] { stroke-dasharray: 1; stroke-dashoffset: calc(1 - clamp(0, (var(--p) - var(--from, 0)) / var(--over, 1), 1)); transition: stroke-dashoffset 0.9s ease; }
      #sigil .mark { opacity: clamp(0, (var(--p) - var(--from, 0)) / var(--over, 1), 1); transition: opacity 0.9s ease; }
      #heart { position: absolute; left: 50%; top: 50%; width: 1.5vh; height: 1.5vh; margin: -0.75vh; transform: rotate(45deg); background: #fff3d0;
        box-shadow: 0 0 2.2vh 0.5vh rgba(255, 196, 120, 0.8); animation: glint 2.8s ease-in-out infinite; }
      #name { font-size: 3.5vh; letter-spacing: 0.52em; margin-right: -0.52em; font-weight: normal; text-shadow: 0 0 2.2vh rgba(255, 190, 110, 0.35); }
      #said { height: 2.6vh; display: grid; place-items: center; }
      #loading { font-size: 1.45vh; letter-spacing: 0.36em; margin-right: -0.36em; opacity: 0.6; }
      #begin { font-size: 1.9vh; letter-spacing: 0.36em; margin-right: -0.36em; animation: breathe 2.6s ease-in-out infinite; }
      @keyframes arrive { from { opacity: 0; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes glint { 50% { box-shadow: 0 0 3vh 0.9vh rgba(255, 210, 140, 0.95); } }
      @keyframes breathe { 50% { opacity: 0.45; } }
      [hidden] { display: none !important; }

      /* Stopped: over the picture as it stood. */
      .sheet { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(14, 9, 30, 0.62), rgba(8, 5, 20, 0.86)); color: #f1d9a4;
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; text-align: center; text-transform: uppercase; }
      .sheet h1 { font-size: 4.4vh; font-weight: normal; margin: 0 0 2vh; letter-spacing: 0.34em; margin-right: -0.34em; text-shadow: 0 0 2vh rgba(255, 190, 110, 0.5); }
      .sheet p { margin: 0.9vh 0; font-size: 1.9vh; letter-spacing: 0.26em; }
      .sheet em { opacity: 0.55; font-style: normal; font-size: 1.4vh; }

      /* What they are told of the keys: written low in the picture for the first seconds, with no box round it. */
      #hint { position: fixed; left: 50%; bottom: 3.6vh; transform: translateX(-50%); color: #f6ead0; font: 1.5vh/1.4 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; width: max-content; max-width: 86vw;
        text-shadow: 0 0 0.7vh rgba(8, 5, 20, 0.95), 0 0 0.3vh rgba(8, 5, 20, 0.9), 0 0.1vh 0.2vh rgba(8, 5, 20, 0.9); transition: opacity 2s; pointer-events: none; }
      #hint.faded { opacity: 0; }
      #touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
      #stick { pointer-events: auto; position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 118px; height: 118px; border-radius: 50%; background: rgba(241, 217, 164, 0.16); border: 2px solid rgba(241, 217, 164, 0.55); }
      #knob { position: absolute; left: 39px; top: 39px; width: 40px; height: 40px; border-radius: 50%; background: rgba(241, 217, 164, 0.88); }
      #cast, #spell { pointer-events: auto; position: fixed; right: max(16px, env(safe-area-inset-right)); width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(241, 217, 164, 0.7); background: rgba(20, 12, 36, 0.55); color: #f6ead0; font: 13px/1.1 'Palatino Linotype', Palatino, Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase; }
      #cast { bottom: max(22px, env(safe-area-inset-bottom)); }
      #spell { bottom: calc(max(22px, env(safe-area-inset-bottom)) + 90px); }
      #cast:active, #spell:active { background: rgba(241, 217, 164, 0.35); }
      #board { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 8; width: min(280px, 86vw); padding: 18px 16px; border: 2px solid #f1d9a4; border-radius: 16px; background: rgba(20, 12, 28, 0.92); color: #f6ead0; text-align: center; font: 18px/1.3 Georgia, serif; touch-action: none; }
      #board button, #back { touch-action: none; }
      #board button { display: block; width: 100%; margin: 10px 0 0; padding: 12px; border-radius: 12px; border: 1px solid #f1d9a4; background: rgba(241, 217, 164, 0.14); color: #f6ead0; font: 16px Georgia, serif; }
      #back { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 7; padding: 8px 16px; border-radius: 999px; border: 1px solid #f1d9a4; background: rgba(20, 12, 28, 0.72); color: #f6ead0; font: 14px Georgia, serif; }
      #aim { position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 4px rgba(0, 20, 60, 0.6); pointer-events: none; }

      /* The spells: a row of medallions at the top left (src/hud.js draws them). Each is a dark disc with a fine gold
         rim and its emblem in the spell's own colour. The one in hand stands larger and lit, its rim fills as the spell
         is gathered, and its name is written under the row. */
      #spells { position: fixed; left: 3vh; top: 2.8vh; pointer-events: none; --s: clamp(46px, 7.4vh, 96px); }
      #spells .row { display: flex; gap: calc(var(--s) * 0.12); align-items: center; }
      #spells .spell { position: relative; width: var(--s); height: var(--s); opacity: 0.74; transform: scale(0.9); transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1.3), opacity 0.25s; }
      #spells .spell.on { opacity: 1; transform: scale(1.14); }
      #spells svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0.2vh 0.5vh rgba(6, 4, 16, 0.55)); }
      #spells .disc { fill: rgba(17, 12, 34, 0.74); }
      #spells .on .disc { fill: color-mix(in srgb, var(--c) 16%, rgba(17, 12, 34, 0.86)); }
      #spells .rim { stroke: #f1d9a4; stroke-width: 0.8; opacity: 0.62; }
      #spells .rim.in { stroke-width: 0.35; opacity: 0.36; }
      #spells .tick { stroke: #f1d9a4; stroke-width: 0.6; opacity: 0.5; }
      #spells .on .rim { opacity: 0.95; }
      #spells .gathered { stroke: var(--c); stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--g, 0)); opacity: 0; }
      #spells .on .gathered { opacity: 1; filter: drop-shadow(0 0 0.5vh var(--c)); }
      #spells .emblem path { stroke: var(--c); stroke-width: 1.5; }
      #spells .emblem .thin { stroke-width: 1; opacity: 0.7; }
      #spells .emblem .full { fill: var(--c); stroke: none; }
      #spells .emblem .dark { fill: #0c0818; stroke-width: 1.2; }
      #spells .on .emblem { filter: drop-shadow(0 0 0.55vh var(--c)); }
      #spells .on .emblem path { stroke-width: 1.7; }
      /* The painted medallions (public/ui): each covers what is drawn for it. Those not in hand are a little dulled; the one
         in hand is lit from behind in its colour, and its gathering is a bright line round its rim. */
      #spells img { position: absolute; inset: -4%; width: 108%; height: 108%; filter: saturate(0.9) brightness(0.93) drop-shadow(0 0.25vh 0.5vh rgba(6, 4, 16, 0.6)); transition: filter 0.25s; }
      #spells .painted { opacity: 1; }
      #spells .painted .disc, #spells .painted .rim, #spells .painted .tick, #spells .painted .emblem { display: none; }
      #spells .painted svg { filter: none; }
      #spells .painted.on img { filter: drop-shadow(0 0 0.9vh var(--c)) drop-shadow(0 0.25vh 0.5vh rgba(6, 4, 16, 0.6)); }
      #spells .painted .gathered { stroke: #fff6dc; stroke-width: 1.5; }
      /* (the key that calls it, on a small bead at the foot of the rim) */
      #spells i { position: absolute; left: 50%; bottom: calc(var(--s) * -0.14); width: calc(var(--s) * 0.3); height: calc(var(--s) * 0.3); margin-left: calc(var(--s) * -0.15); border-radius: 50%;
        background: #110c22; box-shadow: inset 0 0 0 1px rgba(241, 217, 164, 0.55); color: #f1d9a4; font: normal calc(var(--s) * 0.19) / calc(var(--s) * 0.3) Georgia, 'Times New Roman', serif; text-align: center; }
      #spells .on i { box-shadow: inset 0 0 0 1px var(--c); color: #fff6dc; }
      #spells .name { margin: calc(var(--s) * 0.34) 0 0 calc(var(--s) * 0.08); color: #f6ead0; font: calc(var(--s) * 0.3) / 1 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; letter-spacing: 0.34em; text-transform: uppercase;
        text-shadow: 0 0 0.9vh var(--c), 0 0 0.5vh rgba(8, 5, 20, 0.9), 0 0.1vh 0.2vh rgba(8, 5, 20, 0.9); }
      #spells .name.in { animation: named 0.5s ease both; }
      @keyframes named { from { opacity: 0; transform: translateX(-0.8vh); } }
      #hint.off { display: none; }
      .shot #spells, .shot #aim, .shot #hint { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="title">
      <div id="sigil">
        <svg id="outer" viewBox="-100 -100 200 200"></svg>
        <svg id="inner" viewBox="-100 -100 200 200"></svg>
        <div id="heart"></div>
      </div>
      <h1 id="name">Small Magic</h1>
      <div id="said"><span id="loading">Waking the meadow</span><span id="begin" hidden>Click to begin</span></div>
    </div>
    <script>
      // The rune circle, drawn here once (and afterwards moved and written by CSS alone). Outside: a rim, a ring of
      // ticks, a band of runes, a ring. Inside: a star of seven points, one for each spell, a mark at each point, a ring.
      (() => {
        const NS = 'http://www.w3.org/2000/svg', outer = document.getElementById('outer'), inner = document.getElementById('inner');
        if (!outer) return;
        const add = (to, tag, at, from, over, mark) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (!mark) e.setAttribute('pathLength', 1); else e.setAttribute('class', 'mark'); e.style.setProperty('--from', from); e.style.setProperty('--over', over); to.appendChild(e); return e; };
        const ring = (to, r, w, from, over) => add(to, 'circle', { r, 'stroke-width': w, transform: 'rotate(-90)' }, from, over);
        const P = (r, a) => [(r * Math.cos(a)).toFixed(2), (r * Math.sin(a)).toFixed(2)].join(' ');
        ring(outer, 96, 1.1, 0, 0.3); ring(outer, 91, 0.45, 0.06, 0.3);
        // ticks: every sixth one longer
        for (let i = 0; i < 72; i++) { const a = (i / 72) * 6.2832 - 1.5708; add(outer, 'path', { d: `M${P(i % 6 ? 87.5 : 86, a)}L${P(90, a)}`, 'stroke-width': i % 6 ? 0.4 : 0.8 }, 0.1 + 0.25 * (i / 72), 0.05, true); }
        // runes: each a few straight strokes, no two alike, written one after another
        const strokes = [[[0, -5, 0, 5], [0, -5, 3.5, -2], [0, 0, 3.5, 3]], [[-3, 5, 0, -5], [0, -5, 3, 5]], [[0, -5, 0, 5], [0, -2, 3.5, -5], [0, 1, 3.5, -2]], [[-3, -5, 3, 5], [3, -5, -3, 5]], [[0, -5, 0, 5], [-3, -2, 0, -5], [3, -2, 0, -5]], [[-3, -5, -3, 5], [-3, -5, 3, 0], [3, 0, -3, 5]], [[0, -5, 0, 5], [-3.5, 0, 3.5, 0]], [[-3, -5, 3, -5], [0, -5, 0, 5]], [[-3, 5, -3, -5], [-3, -5, 3, 5], [3, 5, 3, -5]], [[0, -5, 3, 0], [3, 0, 0, 5], [0, 5, -3, 0], [-3, 0, 0, -5]], [[0, -5, 0, 5], [0, -5, 3.5, -1], [3.5, -1, 0, 1]], [[-3, -5, 0, 0], [3, -5, 0, 0], [0, 0, 0, 5]]];
        for (let i = 0; i < 24; i++) { const s = strokes[(i * 5) % strokes.length], deg = (i / 24) * 360; add(outer, 'path', { d: s.map(([a, b, c, d]) => `M${a} ${b}L${c} ${d}`).join(''), 'stroke-width': 0.75, transform: `rotate(${deg}) translate(0 -79.5) scale(0.82)` }, 0.24 + 0.3 * (i / 24), 0.06, true); }
        ring(outer, 68, 0.9, 0.3, 0.3);
        // the star: every third point of seven joined in one line
        const star = Array.from({ length: 8 }, (_, k) => P(61, ((k * 3) % 7) / 7 * 6.2832 - 1.5708)).join('L');
        add(inner, 'path', { d: `M${star}`, 'stroke-width': 0.8 }, 0.5, 0.35);
        for (let k = 0; k < 7; k++) { const a = (k / 7) * 6.2832 - 1.5708, [x, y] = P(61, a).split(' '); add(inner, 'circle', { cx: x, cy: y, r: 4.6, 'stroke-width': 0.7, fill: '#150e2a' }, 0.6 + 0.04 * k, 0.08, true); add(inner, 'circle', { cx: x, cy: y, r: 1.1, fill: '#f1d9a4', stroke: 'none' }, 0.64 + 0.04 * k, 0.08, true); }
        ring(inner, 27, 0.8, 0.8, 0.18); ring(inner, 23.5, 0.35, 0.86, 0.14);
      })();
    </script>
    <div id="pause" class="sheet" hidden><div><h1>Paused</h1><p id="resume">Click to carry on</p><p><em>M: sound on or off &middot; H: the controls</em></p></div></div>
    <div id="aim"></div>
    <div id="spells"></div>
    <div id="hint">WASD move &middot; Shift sprint &middot; Space jump &middot; Left button casts, hold for more<br>1 to 7 or the wheel changes spell &middot; P pauses &middot; H hides this</div>
    <div id="board" hidden><p>Where to</p><button type="button" data-go="meadow">Meadow</button><button type="button" data-go="lake">Long Lake</button></div>
    <button id="back" type="button" hidden>Back</button>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <button id="spell" type="button">Spell</button>
      <button id="cast" type="button">Cast</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
